name: VCL Tests

on:
  pull_request:
    paths:
      - 'etc/varnish6.vcl'
      - 'tests/varnish/**'
      - '.github/workflows/vcl_tests.yml'

jobs:
  test:
    name: Varnish ${{ matrix.varnish }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 6.0 runs on a locally built image, because the official varnish:6.0 ships
          # without varnish-modules and three tests need varnishtest features it lacks.
          # See tests/varnish/Dockerfile.varnish60 and the Makefile.
          - varnish: '6.0'
            target: test_varnish60
          - varnish: '7.7'
            target: test
    steps:
      - uses: actions/checkout@v4
      - name: Run Varnish test
        working-directory: tests/varnish
        run: make ${{ matrix.target }}

  test-fresh:
    # Informational: catches breakage on the newest Varnish release early,
    # without blocking a PR when upstream changes something.
    name: Varnish fresh (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Run Varnish test
        working-directory: tests/varnish
        run: make test VARNISH_IMAGE=varnish:fresh
